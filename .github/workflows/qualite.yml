name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Style, types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # La suite s'exécute contre un vrai PostgreSQL avec pgvector : l'isolation du projet
    # repose sur le Row-Level Security, qu'aucune base en mémoire ne saurait reproduire.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jurismind
          POSTGRES_PASSWORD: jurismind
          POSTGRES_DB: jurismind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jurismind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jurismind
      POSTGRES_PASSWORD: jurismind
      POSTGRES_DB: jurismind
      POSTGRES_APP_USER: jurismind_app
      POSTGRES_APP_PASSWORD: jurismind_app
      LEGACY_DB: legacy

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      # L'OCR français est une fonctionnalité du projet, pas un détail d'environnement :
      # sans Tesseract ici, la moitié du corpus ne serait jamais lue par la CI.
      - name: Installer Tesseract et son pack français
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra

      - name: Style (ruff)
        run: |
          uv run ruff check src tests simulation
          uv run ruff format --check src tests simulation

      - name: Types (mypy)
        run: uv run mypy src tests

      # Créée avec le code du projet plutôt qu'avec `psql` : une dépendance de moins
      # envers ce que l'image du runner contient.
      - name: Base du vieux logiciel
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          from jurismind.core.config import get_settings
          adresse = get_settings().database_url.rsplit('/', 1)[0] + '/postgres'
          with create_engine(adresse, isolation_level='AUTOCOMMIT').connect() as connexion:
              connexion.execute(text('CREATE DATABASE legacy'))
          "

      # Le corpus n'est pas versionné : il est reproductible à la graine près, ce qui rend
      # les tests qui lisent de vrais PDF aussi déterministes que les autres.
      - name: Générer le cabinet simulé
        run: uv run python -m simulation --taille small --seed 42

      - name: Tests
        run: uv run pytest -q

  # « Déployable » est une affirmation tant qu'une machine neuve ne l'a pas vérifiée. Ce job
  # construit l'image depuis rien, la démarre, et exige qu'elle réponde. Il tourne en
  # parallèle des tests : une image qui ne se construit plus doit se voir le jour même, pas
  # le jour où quelqu'un essaie de l'installer.
  image:
    name: L'image se construit et démarre
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t jurismind:ci .

      - name: Le français de Tesseract est bien dans l'image
        # Son absence ne casse rien au démarrage : elle fait échouer la lecture des scans,
        # soit un tiers du corpus. C'est exactement le genre de panne qu'on ne voit qu'en
        # production, donc exactement celle qu'il faut vérifier ici.
        run: docker run --rm jurismind:ci tesseract --list-langs | grep -qx fra

      - name: L'application démarre et répond
        # Sans PostgreSQL, `/sante` répond quand même : c'est voulu, il rend « dégradé »
        # plutôt qu'une trace. Ce qu'on vérifie ici, c'est que le processus se lance et sert
        # du HTTP — l'intégration avec la base est couverte par la suite de tests.
        run: |
          docker run -d --name essai -p 8000:8000 jurismind:ci
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8000/sante >/dev/null 2>&1; then
              echo "L'API répond."
              docker rm -f essai
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas répondu en 60 s."
          docker logs essai
          docker rm -f essai
          exit 1
