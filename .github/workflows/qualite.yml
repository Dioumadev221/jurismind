name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Style, types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # La suite s'exécute contre un vrai PostgreSQL avec pgvector : l'isolation du projet
    # repose sur le Row-Level Security, qu'aucune base en mémoire ne saurait reproduire.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jurismind
          POSTGRES_PASSWORD: jurismind
          POSTGRES_DB: jurismind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jurismind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jurismind
      POSTGRES_PASSWORD: jurismind
      POSTGRES_DB: jurismind
      POSTGRES_APP_USER: jurismind_app
      POSTGRES_APP_PASSWORD: jurismind_app
      LEGACY_DB: legacy

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      # L'OCR français est une fonctionnalité du projet, pas un détail d'environnement :
      # sans Tesseract ici, la moitié du corpus ne serait jamais lue par la CI.
      - name: Installer Tesseract et son pack français
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra

      - name: Style (ruff)
        run: |
          uv run ruff check src tests simulation
          uv run ruff format --check src tests simulation

      - name: Types (mypy)
        run: uv run mypy src tests

      # Créée avec le code du projet plutôt qu'avec `psql` : une dépendance de moins
      # envers ce que l'image du runner contient.
      - name: Base du vieux logiciel
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          from jurismind.core.config import get_settings
          adresse = get_settings().database_url.rsplit('/', 1)[0] + '/postgres'
          with create_engine(adresse, isolation_level='AUTOCOMMIT').connect() as connexion:
              connexion.execute(text('CREATE DATABASE legacy'))
          "

      # Le corpus n'est pas versionné : il est reproductible à la graine près, ce qui rend
      # les tests qui lisent de vrais PDF aussi déterministes que les autres.
      - name: Générer le cabinet simulé
        run: uv run python -m simulation --taille small --seed 42

      - name: Tests
        run: uv run pytest -q
