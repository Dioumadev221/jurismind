[project]
name = "jurismind"
version = "0.1.0"
description = "IA juridique : RAG, agents et recherche sémantique sur les données existantes d'un cabinet d'avocats"
readme = "README.md"
authors = [
    { name = "Dioumadev221", email = "dioumadione004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
jurismind = "jurismind:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
simulation = [
    "reportlab>=5.0.1",
]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
